[build]
  command = "npm run build"
  publish = "dist"

# Proxy all /api requests to the backend on Render.
# The 200! status tells Netlify to proxy (not redirect) and the ! means
# this rule takes priority even if a file exists at that path.
[[redirects]]
  from = "/api/*"
  to = "https://api.abes.work/api/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-From = "Netlify"

# SPA fallback — must come AFTER the /api proxy rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
